name: CI

on:
  # Pre-merge gate. Every change reaches recette/main via a PR, so pull_request
  # is the only event needed: it covers feature → recette and recette → main
  # alike, runs exactly once per commit SHA, and avoids the (push)/(pull_request)
  # duplication that doubles every check on a PR. Post-merge validation belongs
  # to the deploy workflows, not this gate.
  #
  # A draft is work in progress and agents push to it by the minute, so nothing
  # runs until it is marked ready: `ready_for_review` is what starts the CI then.
  pull_request:
    branches: [recette, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    if: github.event.pull_request.draft == false
    # Secret scan as its own job: no toolchain install needed, so it reports in
    # seconds and a leaked secret fails the PR even when the build is broken.
    # Separate from the Ferry automation, which runs its own gitleaks internally.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scan contract: this is a per-PR gate, so it scans the working tree at
      # the PR's HEAD (--no-git), not the full commit history. Secrets in
      # historical (already-removed) commits are a one-time audit + rotation
      # concern, not a recurring per-PR signal; --no-git keeps the gate
      # deterministic and fast. Image pinned by digest for supply-chain
      # integrity (zricethezav/gitleaks:v8.21.2).
      - name: Run gitleaks
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo
          zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          detect --source . --no-git --config .gitleaks.toml --redact --no-banner

  scope:
    if: github.event.pull_request.draft == false
    # How much of the gate this PR needs, from the paths it touches
    # (scripts/ci/classifyChanges.ts). Node strips the types itself, so this job
    # needs no `npm ci` and answers in seconds. An unknown path or an unreadable
    # diff classifies as `code`: a mistake costs minutes, never a gate.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Scope the checks to what this PR changes
        id: scope
        run: node --experimental-strip-types scripts/ci/classifyChanges.ts "origin/${{ github.base_ref }}" | tee -a "$GITHUB_OUTPUT"

  gates:
    # Every cheap gate, on every PR whatever it touches: traceability, public-
    # repository hygiene, the migration and ledger checks, formatting.
    runs-on: ubuntu-latest
    needs: scope
    permissions:
      contents: read

    steps:
      # Full history: `lint:req --base` diffs against the merge base with the
      # target branch, which a shallow clone cannot resolve.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Restore the ESLint + Prettier caches so `npm run lint` and
      # `npm run format:check` only re-check files whose *content* changed since
      # a prior run. Both scripts must use `--cache-strategy content` (not the
      # default `metadata`): CI does fresh checkouts, so every file gets a new
      # mtime and `metadata` would never hit. Keyed on the lockfile + both
      # linter configs because ESLint's / Prettier's own caches invalidate on
      # file-content changes but NOT on a plugin/version or rule-config bump;
      # the `github.sha` suffix makes every run save a fresh (non-stale) entry
      # and the restore-keys prefix falls back to the most recent cache for the
      # same config.
      - name: Restore linter caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/eslint
            node_modules/.cache/prettier
          key: linters-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '.prettierrc.json', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            linters-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '.prettierrc.json', '.prettierignore') }}-

      # Diff-scoped, like the pre-commit hook but against the PR base instead of
      # HEAD. A bare run only surveys (the tree still holds ~1245 tests that
      # predate the rule); `--base` is what makes it block, and it blocks on the
      # same two rules the hook enforces — every new test carries a @req, every
      # new export carries one and is covered by a test with the same ID. Without
      # it CI checked neither, so `--no-verify` or a GitHub web edit walked past
      # the rule entirely.
      #
      # A `recette → main` promotion is the one PR where the base is the wrong
      # reference. It carries the whole integration backlog, and every commit in
      # it already passed this rule against `recette` when it landed. Diffed
      # against `main`, the gate re-reads hundreds of already-annotated exports
      # as new — the first such promotion reported 239 violations, none of them
      # a real defect — and the release blocks on nothing. So a promotion is
      # measured against `recette`, which is the state each of its commits was
      # actually gated against. Every other PR keeps its own base.
      - run: npm run lint:req -- --base "origin/$REQ_BASE"
        env:
          REQ_BASE: ${{ github.head_ref == 'recette' && 'recette' || github.base_ref }}

      # New reader-facing French must land in a src/lib/i18n/copy dictionary
      # (REQ-145). Same base as lint:req, for the same reason: the gate reads
      # what the PR adds, and only a diff against the branch it lands on says
      # what that is.
      - run: npm run check:copy-literals -- --base "origin/$REQ_BASE"
        env:
          REQ_BASE: ${{ github.head_ref == 'recette' && 'recette' || github.base_ref }}

      - run: npm run check:editorial

      - run: npm run check:jira-template

      # --resolve also asks GitHub whether each pinned commit exists. A pin with
      # a perfect shape and an invented hash failed the Storybook deploy fifteen
      # times on main while this step, checking the shape only, stayed green.
      # The check asks through the preinstalled `gh`, which reads GH_TOKEN.
      - run: npm run check:action-pins -- --resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A `run:` block is shell source that YAML validation never parses, so a
      # quoting mistake in one only surfaces as a red run, minutes later, with
      # the step having done nothing. `bash -n` is the parser the runner uses.
      - run: npm run check:workflow-shell

      - run: npm run check:env-example

      # This repository is public, so an absolute workstation path publishes the
      # author's machine and the private production workspace beside it. Three
      # such lines were already committed before this gate existed. The
      # pre-commit hook catches them locally; this catches what bypasses it.
      - run: npm run check:local-paths

      # The same public-repository rule for the infrastructure: no server
      # address, SSH port, hosting provider or datacenter location. The terms
      # live outside the repository and the gate prints positions only, never a
      # match. They travel as a **secret**, not a variable: the runner echoes
      # every step's `env:` block, and the Actions logs of a public repository
      # are public — a variable published the whole deny-list in clear text
      # from 2026-09-14 until this line changed. A secret is masked as `***`.
      - run: npm run check:infra-disclosure
        env:
          INFRA_DISCLOSURE_TERMS: ${{ secrets.INFRA_DISCLOSURE_TERMS }}

      # The same question, asked of prose. check:dead holds unreferenced code
      # at zero; nothing held documentation, and 15 of 84 tracked documents
      # were referenced by nothing at all — two of them written that week. A
      # charter nobody can reach is a charter nobody applies.
      - run: npm run check:orphan-docs

      # public/ is served from the repository and had no size check at all —
      # no .gitattributes, no LFS, nothing in CI. Survivable for a fixed set
      # of illustrations; not for the carousel frames, which arrive by the
      # dozen. The ceiling lands before the first pass rather than after it,
      # because a budget written once the directory has doubled is a budget
      # written around the damage.
      - run: npm run check:asset-weight

      # Three gates that existed and ran nowhere, measured 2026-09-18. Two of
      # them were documented as "all CI-blocking on
      # every PR", which is the worst shape a check can take: believed, and
      # protecting only whoever remembers to type it. They are cheap — two tsx
      # scripts — so the answer was to make the
      # sentence true rather than to soften it.
      - run: npm run check:skill-parity
      - run: npm run check:pagination-contract

      # Pre-merge, only what is knowable without a database: no two files
      # claiming the same version or name, no hole in the sequence. Whether a
      # migration is *applied* is meaningless here — the one this PR adds is
      # pending by definition — so that check runs after the merge, in
      # migrate-recette.yml, and nightly in data-integrity.yml.
      - run: npm run check:migration-files

      # Replays the migration files as a schema timeline and fails on any live
      # table that never received ENABLE ROW LEVEL SECURITY — the anon key ships
      # in the browser bundle, so such a table is writable by any visitor. The
      # script existed, passed, and was wired to nothing.
      - run: npm run check:rls-coverage

      # Validates docs/productions/ — the versioned publishing-cadence ledger.
      # Not a ratchet: every entry is authored once and must be correct as
      # written.
      - run: npm run check:production-ledger

      - run: npm run format:check

  docs-tests:
    # A docs or corpus PR cannot move coverage, but ~100 tests read `docs/`
    # and `dataset/` straight off the disk (no import for `--changed` to
    # follow), so those run by name. The list comes from grep, never from a
    # hand-kept table that would drift as tests are added.
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.scope != 'code'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: >
          npx vitest run
          $(grep -rlE "dataset/|docs/" --include='*.test.ts' --include='*.test.tsx' src scripts eslint)

  lint:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Restore the ESLint + Prettier caches so `npm run lint` and
      # `npm run format:check` only re-check files whose *content* changed since
      # a prior run. Both scripts must use `--cache-strategy content` (not the
      # default `metadata`): CI does fresh checkouts, so every file gets a new
      # mtime and `metadata` would never hit. Keyed on the lockfile + both
      # linter configs because ESLint's / Prettier's own caches invalidate on
      # file-content changes but NOT on a plugin/version or rule-config bump;
      # the `github.sha` suffix makes every run save a fresh (non-stale) entry
      # and the restore-keys prefix falls back to the most recent cache for the
      # same config.
      - name: Restore linter caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/eslint
            node_modules/.cache/prettier
          key: linters-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '.prettierrc.json', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            linters-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '.prettierrc.json', '.prettierignore') }}-

      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      # The one question none of the gates above asks: does anything still
      # import this? Ten checks watched traceability, action pins, the env
      # example, the migration sequence and the charters, and none of them
      # noticed thirty-two unreferenced files or thirteen unused dependencies
      # accumulating. The ceilings live in scripts/ci/checkDeadCode.ts and can
      # only go down.
      - run: npm run check:dead

  tests:
    # The suite is 1,095 files and took 5-8 minutes on one machine. Four shards
    # run it side by side; each writes a blob (results + raw coverage) and skips
    # the coverage thresholds, which mean nothing on a slice. `tests-coverage`
    # merges the blobs and applies the thresholds once.
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob --coverage.reporter=json
        env:
          VITEST_SHARD: "1"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          # The directory starts with a dot, which upload-artifact skips by
          # default; with a warning only, the shards looked green and the merge
          # found nothing to merge.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  tests-coverage:
    # The merged report: every test result, and the one coverage threshold.
    # The charter contract suite is ordinary vitest files, so a charter
    # regression fails in a shard under its own file name; the dedicated step
    # that re-ran it after the suite is gone.
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - run: npx vitest --merge-reports --coverage

  next-build:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.scope == 'code'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # .next/cache is content-hashed by Next, so a stale entry is ignored,
      # never mis-served — restoring it only ever saves compile work.
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      # The Supabase modules validate their configuration at module scope and
      # throw when it is missing, which fails Next's page-data collection, so
      # the build needs values that parse. It gets placeholders on every run,
      # never the real secrets: the build is not isolated from the database —
      # `sitemap.xml` is generated at build time and reads every entity id —
      # and a hosted project on a metered egress quota paid for that read on
      # every push. Against the placeholder host the sitemap's reads fail and
      # fall back to the static rubrics, which is all this gate needs to prove
      # the app compiles. The same values keep it running on Dependabot and
      # fork PRs, where secrets are not exposed.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"

      # Nothing above may rewrite a tracked file or leave an unignored one.
      # next-env.d.ts was rewritten by every `next build` and committed back by
      # whoever built last, so its content flipped with each contributor; it is
      # untracked now, and this step keeps the next generated file from taking
      # its place unnoticed.
      - name: Check the gates left the tree clean
        run: |
          git diff --exit-code
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            printf 'Untracked or modified files after the build:\n%s\n' "$dirty"
            exit 1
          fi

  build:
    # `CI / build` is the one required check and keeps its name: this job is
    # the verdict. It waits for every other job and fails if any of them failed
    # or was cancelled; a skipped one (the code-only jobs on a docs or corpus
    # PR) counts as passed. Adding a job to this workflow means adding it to
    # `needs`, or its failure no longer blocks the merge.
    runs-on: ubuntu-latest
    needs:
      [
        scope,
        gates,
        docs-tests,
        lint,
        typecheck,
        tests,
        tests-coverage,
        next-build,
      ]
    if: always() && github.event.pull_request.draft == false
    permissions:
      contents: read

    steps:
      - name: Every job this PR needed has passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | node -e '
            const needs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const bad = Object.entries(needs).filter(([, n]) => !["success", "skipped"].includes(n.result));
            for (const [name, n] of bad) console.error(`${name}: ${n.result}`);
            process.exit(bad.length ? 1 : 0);
          '

  dependency-audit:
    if: github.event.pull_request.draft == false
    # A high-severity advisory in a dependency change fails the PR that
    # introduces it. GitHub's dependency diff is independent of npm's audit
    # endpoint, whose bulk API can fall back to the retired quick API during
    # registry incidents and fail before it examines a single advisory.
    # Moderate findings stay visible in the job summary without blocking.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
