name: AI Source Verification

# Proposes real sources for the corpus's ai_generated citations by web search,
# and opens a pull request carrying only the ledger change
# (docs/editorial/source-review/ai-source-verifications.json). No fiche is
# touched here: a proposal becomes a citation only after a human sets it to
# `accepted` and runs scripts/afrik/applyAiSourceVerifications.ts.

on:
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "How many ai_generated sources to search for"
        required: false
        default: "20"

# One run at a time: two runs would number their proposals from the same last
# id and collide when both pull requests merge.
concurrency:
  group: ai-source-verification
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: recette

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Propose candidate sources
        run: npx tsx scripts/afrik/verifyAiGeneratedSources.ts --limit "$LIMIT"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ inputs.limit || '20' }}

      # A pull request opened with GITHUB_TOKEN does not trigger other
      # workflows, so its checks start when a reviewer pushes or re-runs them.
      # That is acceptable here: the change is the ledger alone, and the review
      # it needs is a human reading the candidates.
      - name: Open a pull request with the proposals
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ledger="docs/editorial/source-review/ai-source-verifications.json"
          if git diff --quiet -- "$ledger"; then
            echo "No new proposal; nothing to open."
            exit 0
          fi
          branch="chore/ai-source-verification-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$ledger"
          git commit -m "chore(sources): propose candidate sources for ai_generated citations"
          git push origin "$branch"
          gh pr create \
            --base recette \
            --head "$branch" \
            --title "chore(sources): propose candidate sources for ai_generated citations" \
            --body "Web-search proposals for ai_generated corpus sources, appended to \`$ledger\` with status \`proposed\`. Nothing in the corpus changes. For each entry, a reviewer checks the candidates (open the url, read the quote) and sets the status to \`accepted\` (with \`chosen\`, \`tier\`, \`decidedBy\`, \`decidedAt\`), \`rejected\` or \`oral_needed\` — see docs/editorial/source-review/README.md."
