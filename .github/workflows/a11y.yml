name: A11y — axe-core

on:
  # A required check on both branches, and the one that sets how long a pull
  # request takes to become mergeable — so it stays pre-merge. The `push` on
  # main was dropped for the reason ci.yml and data-integrity.yml already give
  # for themselves: every change reaches main through a pull request, so the
  # post-merge run re-audited an identical tree and nothing read its result.
  pull_request:
    branches: [recette, main]

# Superseded runs of the same branch are cancelled. Without this a branch pushed
# three times kept three generations of a ~15 min audit (both locales, since
# ETNI-1858) competing for runners,
# which is what turned a busy afternoon of parallel pull requests into a queue.
concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The scope step lists the pull request's changed files.
  pull-requests: read

jobs:
  axe:
    name: axe-core (Storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Test-only publication: production remains fail-closed to fr-only.
      SITE_LOCALE_MODE: bilingual-fr-default

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A pull request that changes only documentation skips the build and
      # every step that reads the recette database, which sits on a plan
      # metered by egress. The job still runs to the end and reports green, so
      # the required check never waits on a status that will not come — which
      # is why this is a step and not a `paths:` filter. It fails closed: a
      # file list it cannot read, an empty one, a pull request from recette or
      # any file outside docs/, .claude/ and root Markdown renders. A rename
      # counts its old path too, so moving a file out of src/ is not "docs".
      - name: Scope the checks to what the pull request changed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          render=true
          docs_only='^(docs/|\.claude/|[^/]+\.md$)'
          if [ "$HEAD_REF" = "recette" ]; then
            echo "A pull request from recette always renders."
          elif ! files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')"; then
            echo "::warning::Could not list the pull request's files, so the checks render."
          elif [ -z "$files" ]; then
            echo "The pull request lists no changed files, so the checks render."
          else
            render=false
            while IFS= read -r file; do
              if [[ ! $file =~ $docs_only ]]; then
                render=true
                echo "$file is outside docs/, .claude/ and root Markdown, so the checks render."
                break
              fi
            done <<< "$files"
            if [ "$render" = false ]; then
              echo "::notice::Only docs/, .claude/ or root Markdown changed: skipping the build and every step that reads the database."
            fi
          fi
          echo "render=$render" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Storybook
        run: npm run build-storybook

      # Same Playwright version, same browser build, downloaded fresh on every
      # run: 54 s of the job was re-fetching bytes it already had. Keyed on the
      # lockfile so a version bump misses the cache and refetches, as it should.
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Skip cleanly on forks / Dependabot PRs that cannot access the Supabase
      # secrets, and on documentation-only PRs (the scope step above) — the
      # Storybook-only axe check above still runs and gates.
      # Mirrors .github/workflows/lighthouse.yml.
      - name: Check required secrets are present
        id: secrets
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping live-route a11y audit (scripts/a11yRoutes.ts, both locales) — NEXT_PUBLIC_SUPABASE_URL secret not available (fork or Dependabot PR)."
          fi

      # Same artefact ci.yml already builds for this commit: restoring it takes
      # the build from ~45 s to ~11 s. .next/cache is content-hashed by Next, so
      # a stale entry is ignored rather than mis-served.
      - name: Restore Next.js build cache
        if: steps.secrets.outputs.present == 'true' && steps.scope.outputs.render == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js app
        if: steps.secrets.outputs.present == 'true' && steps.scope.outputs.render == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Epic 10, Story 10.11 (ETNI-500) — the quiz route 404s (isQuizFeatureEnabled)
          # unless this is set, which would silently audit nothing.
          NEXT_PUBLIC_FEATURE_QUIZ: "true"

      - name: Start Next.js server
        if: steps.secrets.outputs.present == 'true' && steps.scope.outputs.render == 'true'
        run: npm run start &
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_FEATURE_QUIZ: "true"

      - name: Wait for server to be ready
        if: steps.secrets.outputs.present == 'true' && steps.scope.outputs.render == 'true'
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run axe-core checks
        run: npx tsx scripts/a11y-test.ts
        env:
          A11Y_LIVE_BASE_URL: ${{ steps.secrets.outputs.present == 'true' && steps.scope.outputs.render == 'true' && 'http://localhost:3000' || '' }}
